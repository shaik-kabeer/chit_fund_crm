version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chitfund-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chitfund
      POSTGRES_PASSWORD: chitfund_dev_2024
      POSTGRES_DB: chitfund
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chitfund']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chitfund-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
